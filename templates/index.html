<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Posts dos usuários</title>
</head>
<body>
    <h1>Usuários</h1>
    <p>Selecione um usuário para ver suas publicações.</p>

    <form id="form-usuarios">
        <label for="termo-usuario">Buscar por nome ou username:</label>
        <input id="termo-usuario" type="search">
        <button type="submit">Buscar usuários</button>
        <button id="todos-usuarios" type="button">Mostrar todos</button>
    </form>

    <p id="mensagem-usuarios" aria-live="polite"></p>

    <ul id="usuarios"></ul>

    <form id="form-busca">
        <label for="termo">Buscar conteúdo de todos os usuários:</label>
        <input id="termo" type="search" required>
        <button type="submit">Buscar</button>
    </form>

    <section aria-live="polite">
        <h2 id="titulo">Publicações</h2>
        <p id="bio"></p>
        <p id="mensagem">Nenhum usuário selecionado.</p>
        <div id="posts"></div>
        <nav id="paginacao" aria-label="Páginas da busca" hidden>
            <button id="anterior" type="button" disabled>Anterior</button>
            <span id="pagina-atual"></span>
            <button id="proxima" type="button" disabled>Próxima</button>
        </nav>
    </section>

    <script>
        const listaUsuarios = document.querySelector("#usuarios");
        const titulo = document.querySelector("#titulo");
        const bio = document.querySelector("#bio");
        const mensagem = document.querySelector("#mensagem");
        const listaPosts = document.querySelector("#posts");

        let selecaoAtual = 0;

        const paginacao = document.querySelector("#paginacao");
        const anterior = document.querySelector("#anterior");
        const proxima = document.querySelector("#proxima");
        const indicadorPagina = document.querySelector("#pagina-atual");

        let termoAtual = "";
        let paginaAtual = 1;

        async function consultar(url) {
            const resposta = await fetch(url);

            if (!resposta.ok) {
                throw new Error("Não foi possível consultar os dados.");
            }

            return resposta.json();
        }

        async function mostrarPerfil(username) {
            paginacao.hidden = true;
            const selecao = ++selecaoAtual;

            titulo.textContent = "Publicações";
            bio.textContent = "";
            listaPosts.replaceChildren();
            mensagem.textContent = "Carregando publicações...";

            try {
                const dados = await consultar(
                `/api/usuarios/${encodeURIComponent(username)}`
                );

                if (selecao !== selecaoAtual) return;

                titulo.textContent = `${dados.usuario.nome} (@${dados.usuario.username})`;
                bio.textContent = dados.usuario.bio || "";

                mensagem.textContent = dados.posts.length === 0
                ? "Este usuário ainda não publicou."
                : "";

                for (const post of dados.posts) {
                    const artigo = document.createElement("article");
                    const conteudo = document.createElement("p");
                    const data = document.createElement("time");

                    conteudo.textContent = post.conteudo;
                    data.dateTime = post.criado_em;
                    data.textContent = "Publicado em: " +
                    new Date(post.criado_em).toLocaleString("pt-BR");

                    artigo.append(conteudo, data, document.createElement("hr"));
                    listaPosts.append(artigo);
                }
            } catch (erro) {
                if (selecao !== selecaoAtual) return;
                mensagem.textContent = erro.message;
            }
        }

        async function pesquisarPosts(termo, pagina) {
            paginacao.hidden = true;
            anterior.disabled = true;
            proxima.disabled = true;

            const selecao = ++selecaoAtual;

            titulo.textContent = `Resultados para "${termo}"`;
            bio.textContent = "";
            listaPosts.replaceChildren();
            mensagem.textContent = "Buscando...";

            try {
                const dados = await consultar(
                `/api/posts/busca/${encodeURIComponent(termo)}?pagina=${pagina}`
                );

                if (selecao !== selecaoAtual) return;

                termoAtual = termo;
                paginaAtual = dados.pagina;

                indicadorPagina.textContent = `Página ${paginaAtual}`;
                anterior.disabled = !dados.tem_anterior;
                proxima.disabled = !dados.tem_proxima;
                paginacao.hidden = false;

                mensagem.textContent = dados.posts.length === 0
                ? "Nenhuma publicação encontrada."
                : "";

                for (const post of dados.posts) {
                    const artigo = document.createElement("article");
                    const autor = document.createElement("strong");
                    const conteudo = document.createElement("p");
                    const data = document.createElement("time");

                    autor.textContent = `${post.nome} (@${post.username})`;
                    conteudo.textContent = post.conteudo;
                    data.textContent = "Publicado em: " +
                    new Date(post.criado_em).toLocaleString("pt-BR");

                    artigo.append(autor, conteudo, data, document.createElement("hr"));
                    listaPosts.append(artigo);
                }
            } catch (erro) {
                if (selecao !== selecaoAtual) return;
                mensagem.textContent = erro.message;
            }
        };

        document.querySelector("#form-busca").addEventListener("submit", (evento) => {
            evento.preventDefault();

            const termo = document.querySelector("#termo").value.trim();

            if (termo) {
                pesquisarPosts(termo, 1);
            }
        });

        anterior.addEventListener("click", () => {
            pesquisarPosts(termoAtual, paginaAtual - 1);
        });

        proxima.addEventListener("click", () => {
            pesquisarPosts(termoAtual, paginaAtual + 1);
        });

        let buscaUsuariosAtual = 0;

        async function carregarUsuarios(termo = "") {
            const busca = ++buscaUsuariosAtual;
            const aviso = document.querySelector("#mensagem-usuarios");

            listaUsuarios.replaceChildren();
            aviso.textContent = "Carregando usuários...";

            const url = termo
            ? `/api/usuarios/busca/${encodeURIComponent(termo)}`
            : "/api/usuarios";

            try {
                const dados = await consultar(url);

                if (busca !== buscaUsuariosAtual) return;

                aviso.textContent = dados.usuarios.length === 0
                ? "Nenhum usuário encontrado."
                : "";

                for (const usuario of dados.usuarios) {
                    const item = document.createElement("li");
                    const botao = document.createElement("button");

                    botao.type = "button";
                    botao.textContent = `${usuario.nome} (@${usuario.username})`;

                    botao.addEventListener("click", () => {
                        paginacao.hidden = true;
                        mostrarPerfil(usuario.username);
                    });

                    item.append(botao);
                    listaUsuarios.append(item);
                }
            } catch (erro) {
                if (busca !== buscaUsuariosAtual) return;
                aviso.textContent = erro.message;
            }
        }

        document.querySelector("#form-usuarios").addEventListener("submit", (evento) => {
            evento.preventDefault();

            const termo = document.querySelector("#termo-usuario").value.trim();
            carregarUsuarios(termo);
        });

        document.querySelector("#todos-usuarios").addEventListener("click", () => {
            document.querySelector("#termo-usuario").value = "";
            carregarUsuarios();
        });

        carregarUsuarios();
    </script>
</body>
</html>
